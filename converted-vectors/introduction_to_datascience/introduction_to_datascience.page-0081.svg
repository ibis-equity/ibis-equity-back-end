    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑖</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">is90%.Theclusterassignmentfollowsthesameruleasabove,i.e.,</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">isassignedtotheclusterthatmaximizestheweight</text>
