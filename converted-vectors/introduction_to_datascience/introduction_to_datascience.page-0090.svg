    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thelevelisdeﬁnedasthedistanceofthetwoclustersthataremerged.Thus,thelevelcanbeseenasthedistancebetweenthetwocitiesthataremerged.Consequently,alowlevelmeansthattheclustersthatarecombinedarenotfarawayfromeachother,ahigherlevelindicatesthatthereissomegapbetweentheclustersthatweremerged.Basedontheseideas,wegetarelativelysimplealgorithm.</text>
