    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Repeatsteps2.and3.untilallinstancesareinonecluster.Thedifferentclustersandhowtheresultcanbeinterpretedisbestevaluatedthroughvisualizationwitha</text>
