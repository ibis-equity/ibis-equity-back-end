    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Atthebottomofthedendrogram,wehavealltheinstances,i.e.,theclustersoflevel0.Eachhorizontallineconnectstwoclustersintoanewcluster.Thelocationofthehorizontallinesonthey-axisisthelevelofthenewcluster.Forexample,thehorizontallineat0.1combinesallinstancesontheleftsideofthetreewithallinstancesontherightsideofthetreeintoanewclusteroflevel0.1.Fromthis,wealsoknowthattheminimaldistanceoftheinstanceontheleftsideofthattreetoallinstancesontherightsideofthattreeis0.1.Theblackhorizontallineisat0.03.Thecolorsbelowindicatetheresultingclusters,i.e.,theclusterswithalevelofatmost0.03.Theleftﬁgureisverydenseatthebottomandwebasicallyseelargecoloredregions.Thisisbecausewehaveallinstancesatthebottom,inthiscase300.Atricktomakethebottomofthetree“readable”istodropthe</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">lowerlayers</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ofthetree.Thismeansthatwedonotvisualizeclustersofalllevels,butonlythehighestlevelsofclusters.Forexample,therightﬁgureshowsonlythe15highestlevelsofclusters.Thisway,wedonotseetheindividualinstancesatthebottomofthedendrogram,butratherrelativelysmallclusters.Asaresult,wecanseethestructureofthedendrogram.</text>
