    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">AreaUndertheCurve(AUC)</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheAreaUndertheCurve(AUC)isaperformancemetricbasedontheROCcurve.TheROCcurveisagreattoolforthevisualanalysisoftheimpactofdifferentthresholdsaswellasfortheselectionofsuitablethresholdsifthereisadesiredgoalfortheTPRorFPR.TheAUCcomputesasinglevaluebasedontheROCcurvethatestimateshowwellthehypothesisperformsindependentofanyspeciﬁcthreshold.TheideabehindtheAUCisquitesimple.IfthebestcombinationsofTPRandFPRareintheupper-leftcorneroftheROCcurve,thismeansthattheperformanceisbetteriftheareaunderthecurveincreases.Thus,ifweintegratetheareaundertheROCcurve,wecanestimatehowwellaclassiﬁerperforms.Hence,thename:wehavetheareaunderthe(ROC)curve.</text>
