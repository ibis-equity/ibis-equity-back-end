    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheclosertheAUCvalueistoone,thebettertheperformanceofourclassiﬁer.Intermsofinterpretation,AUChassimilarproblemsasMCC:whileavalueof1isoptimal,theworstvalueisnot0,butrather0.5.Thisisbecauseifwejustrandomlyguessifwehaveapositiveoranegativeinstance,theTPRequalstheFPR,whichisthediagonaloftheROCcurve.Thus,anAUCvalueof0.5representsrandomguessing.Avalueof0meansthatwehaveaTPRof0andanFPR1.SameasfornegativevaluesofMCC,wecouldjustdotheoppositeofthehypothesisandgetaperfectresult.Consequently,valuesofAUCarebetter,thefarthertheyareawayfrom0.5.</text>
