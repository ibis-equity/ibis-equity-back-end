  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Whileridgeleadstosmallcoefﬁcients,thecorrelatedvariablesarestillbothnon-zero.Amodelwithsimilarperformance,thatusesfewerfeaturesisoftenbetter,becausethelikelihoodofoverﬁttingisreduced.Thegoaloflassoistonotonlyminimizethecoefﬁcientvaluesofcorrelatedvariables,buttoachievethattheybecomeexactlyzero.Forthis,theOLSproblemismodiﬁedsuchthat</text>
