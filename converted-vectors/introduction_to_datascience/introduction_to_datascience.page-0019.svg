  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ascanbeseen,businessintelligenceisfocusedontheanalysisandreportingofthepast.Dataistypicallystoredindatabases,structuredandreadytobeanalyzed.Datascienceismoreorlessasuperset.Everythingfrombusinessintelligencemayalsobecoinedasdatascience,however,datasciencegoesbeyondthatbyconsideringthefuture.Thus,datasciencetriestogeneralizefromthedatasuchthatforecastsandpredictionsarepossible,whichmeansmorecomplexquestionscanbeanswered,e.g.,howdifferentscenarioswillplayout.Thisallowsdeeperinsightsthanbusinessintelligence.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1.3</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheSkillsofDataScientists</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Datascientistsarenotcomputerscientists,mathematicians,statisticians,ordomainexperts.Instead,theperfectdatascientistisacombinationofallofthat.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Goodmathematicsskills,especiallyaboutoptimizationandstochastics.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Statisticianwithknowledgeaboutregression,statisticaltests,andsimilartechniques.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Computerscienceskills,includingprogramming,databases,algorithms,datastructures,parallelcomputing,andideallyalsoBigdatainfrastructures.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Strongknowledgeintheintersectionoftheﬁelds,especiallymachinelearning.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Enoughdomainknowledgetounderstandthedata,thequestionsthatmustbeanswered,andhowthequestionscanbeansweredwiththeavailabledata.Softskillsarealsoimportantfordatascientists.Teamworkisoftenrequired,asdatascientistsoftenworkattheintersectionbetweendomainexpertsontheonehand,andtechnicalstaffontheotherhand.Thedomainexpertsteachthedatascientistsaboutdata,thequestionsthatshouldbeanswered,andhowtheoutcomeofprojectsshouldaffectfutureresearchand/orbusinessprocesses.Thetechnicalstaffoftentakesoveratsomepointwhen(andif!)projectsareoperationalized.Moreover,thedata</text>
