    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">SingleLinkageClustering</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thereisanotherwayhowcitiesoftengrow,i.e.,bymergingwithothercitiesandvillagesintoalargercity.Thisisalwaysdonebycitiesthatareclosetoeachother.Thisistheconceptof</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">hierarchicalclustering</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Theideaistobuildclustersbygrowingthem,similartoDBSCAN,butnotbyconsideringdenseneighborhoods,butinsteadbymergingofexistingclustersintolargerclusters.Theoutcomeofhierarchicalclusteraremanydifferentpossibleclusterresults,becausethemergingofclusterscancontinueuntilallinstancesareinasinglecluster.Theresultofhierarchicalclusteringmaylookasfollows.</text>
