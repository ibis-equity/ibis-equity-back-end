    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheresultlookssimilartotheoutcomeoftheDBSCANclustering,butthereisonekeydifference.Thereisnonoise,insteadtherearesomeverysmallclusters,someevenwithonlyasingleinstance,e.g.,theleft-mostinstance.Thedifferencebetweenhierarchicalclusteringalgorithmsishowtheclustersaredeterminedbymergingdata.Wenotethattherearealsohierarchicalclusteringalgorithmsthatworktheotherwayaround,i.e.,bysplittinglargerclustersintosmallerclusters,e.g.,</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">CompleteLinkageClustering</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.However,inthefollowing,wefocusonthe</text>
