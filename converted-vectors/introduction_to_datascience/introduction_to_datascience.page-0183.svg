    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Parallelization</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ThedesignofMapReduceenablesparallelizationforeverystepofthecomputationalprocess.Theinputcanbereadinchunkstoparallelizethecreationoftheinitialkey-valuepairs.Forexample,wecouldhavemultipletextﬁles,eachwith1000linesthatcouldbeprocessedinparallel.Theparallelismislimitedbythethroughputofthestorageandmakesmoresense,ifthedataisdistributedacrossmultiplephysicalmachines.map()canbeappliedtoeachkey-valuepairindependentlyandthepotentialforparallelismisonlylimitedbytheamountofdata.shufﬂe()canstartassoonastheﬁrstkey-valuepairisprocessedbythemapfunction.Thisreducesthewaitingtimes,suchthattheshufﬂingisoftenﬁnisheddirectlyafterthelastcomputationsformapareﬁnished.reduce()canruninparallelfordifferentkeys.Thus,theparallelismisonlylimitedbythenumberofuniquekeyscreatedbymap().Moreover,reduce()canalreadystart,onceallresultsforakeyareavailable.Thisiswheresortingbyshufﬂecanhelp.Iftheresultspassedtoreduce()aresorted,reducecanstartprocessingforakey,onceitseesresultsforthenextkey.</text>
