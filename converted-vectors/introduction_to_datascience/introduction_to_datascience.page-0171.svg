  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Withhypothesistestingthedevilisinthedetails,i.e.,therearemanythingsthatcanbeforgottenorusedinanimpreciseway,whichoftenleadstooverstatingtheresults.Therearesomebigissuesthatarefrequentlymisinterpreted.First,peopleoftenusehypothesistestingtomakebinarystatements,e.g.,“thedataisnormal”insteadof“thestatisticaltestindicatesthatthedataislikelynormal”.Thisisabigdifference:oneleavesroomfortheexpectederrorswithhypothesistesting,theotherisanabsolutestatementindicatingthatthisistrue.Thatthesemistakeshappen(alot!),isunderstandable.Writingabouttheresultsofstatisticaltestsinacorrectwayishard,becauseyouhavetobecarefultoavoidbinarystatements,whilestilldrawingrelevantconclusions.Regardless,goodscientiﬁcpracticemandatesthatthisshouldbeavoided.Second,p-valuesaremisusedbecausemanypeopledonotunderstandwhatthep-valuesare.Thisiswhytherearemanyresearchersadvocatingthathypothesistestingandp-valuesshouldbeabolished,infavorofothermethods.Therearealsomanyresearcherswhosaythatabolishingp-valueswouldnotsolvetheproblemthatpeopledonotunderstandstatistics,whichisthereasonforthemisuse.Thetwomostimportantmisusesare</text>
