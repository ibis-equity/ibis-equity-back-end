    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheusercontactstheNameNodewiththerequesttocreateanewﬁle.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thenamenoderespondswithadatastreamthatcanbeusedforwritingtheﬁle.Fromtheuser’sperspective,thisisanormalﬁlestreamthatwouldbeusedforlocaldataaccess(e.g.,</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">FileInputStream</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">inJava,</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ifstream</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">inC++,</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">open</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">inPython).</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">3.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Theuserwritesthecontentsoftheﬁletotheﬁlestream.TheNameNodeconﬁguredtheﬁlestreamwiththeinformationhowtheblocksshouldlooklikeandwherethedatashouldbesent.Thedataisdirectlysentblock-wisetooneoftheDataNodes.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">4.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheDataNodethatreceivestheblockdoesnotnecessarilystoretheblockitself.Instead,theblockmaybeforwardedtootherDataNodesforstorage.Eachblockisstoredatdifferentnodesandthenumberofthesenodesisdeﬁnedbythe</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">replicationlevel</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Moreover,theHDFSensuresthatblocksareevenlydistributedamongthedatanodes,i.e.,aDataNodeonlystoresmultipleblocksofaﬁle,iftheblockcannotbestoredatanotherDataNode.Ideally,allDataNodesstorethesamenumberofblocksofaﬁle.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">5.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WhenaDataNodestoresablock,thisisacknowledgedtotheDataNodethatreceivesthedatafromtheuser.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">6.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">OncetheDataNodereceivedacknowledgementsforallreplicationsofablock,theDataNodeacknowledgestotheuserthattheblockisstored.Theusercanthenstartsendingthedataforthenextblock(gotostep3),untilallblocksarewritten.Theuserdoesnotobservethisbehaviordirectly,becausethisisautomaticallyhandledbytheﬁlestream.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheuserinformstheNameNodethatthewritingﬁnishedandclosestheﬁlestream.</text>
    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">12.3.2</text>
    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">YARN</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ThesecondcorecomponentofHadoopisYARN,whichismanagerforcomputationalresourcesthatisdesignedtoen-abledistributedBigDatacomputationswithdatastoredintheHDFS.SameastheHDFS,YARNhasamaster/workerparadigm.</text>
