    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">onDataNodes.ReplicationmeansthateachblockisnotjuststoredonasingleDataNode,butonmultipleDataNodes.Thisensuresthatnodataislost,ifadatanodeislost.ToavoidthattheHDFSisnotavailableiftheNameNodecrashes,therecanalsobeasecondaryNameNode.ThisavoidsthattheNameNodeisasinglepointoffailure.IfthereisaproblemwiththeprimaryNameNode,thesecondaryNameNodecantakeoverwithoutlossofservice.AnotherimportantaspectoftheHDFSisthatwhileusersaccesstheHDFSviatheNameNode,theactualdataisneversentviatheNameNodetotheDataNodes,butdirectlyfromtheuserstotheDataNodes.ThefollowingﬁgureshowshowaﬁleinHDFSiscreatedbyauser.</text>
