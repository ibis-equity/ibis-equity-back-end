    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">HDFSisdesignedtosupportdatalocalcomputationsandminimizethedatathatneedstobesendaroundinaclusterforﬁleoperations.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Sinceoutagesofsinglenodesinalargecomputeclusterisnotarareevent,butratherapartofthedailywork,HDFSisdesignedtoberesilientagainsthardwarefailures,suchthatthereisnolossofdataandnointerruptionofservice.Inprinciple,HDFSusesamaster/workerparadigmwitha</text>
