    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheHDFSisthecoreofHadoop.AlldatathatshouldbeanalyzedisstoredintheHDFS.HDFSwasdesignedwiththegoaltoenableBigDataprocessing,whichiswhyHDFSbehavequitedifferentlyfromotherﬁlesystemsthatweregularlyuselikeNTFS,ext3,orxfs.</text>
