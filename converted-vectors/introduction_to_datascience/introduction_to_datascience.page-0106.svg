  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Whetherthemacroaverageorthemicroaverageisabetterchoicedependsontheusecaseandthedata.Ifthedataisbalanced,i.e.,thereisasimilaramountofdataforeachclass,theresultsforthemacroaverageandthemicroaveragewillbealmostthesame.Whenthedataisimbalanced,i.e.,thereareclassesforwhichtherearefewerinstancesthanothers,themacroaveragewilltreatallclassesthesame.Becausethemacroaverageisthearithmeticmeanoftheperformancemetricsforeachclass,theimpactontheaverageisthesameforallclasses.Thisisnotthecaseforthemicroaverage,whereclasseswithlessinstanceshaveasmallerimpact,becausethecountislowerandtheindividualcountsareused.Thus,incaseofclasslevelimbalance,themacroaveragehastheadvantagethatallclassesarefairlyrepresentedintheaverage.Thedrawbackofthisisthatclasseswithonlyfewinstancesmayhaveanoverlylargeimpactonthemacroaverage.Viceversa,theimpactonthemicroaverageofeachclassisonlyaslargeasthenumberofinstancesfortheclass,butthereisariskthatclasseswithfewinstancesmaybeignored.</text>
