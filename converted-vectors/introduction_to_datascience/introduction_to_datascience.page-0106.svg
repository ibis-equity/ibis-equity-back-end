  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Allmetricsabovearedeﬁnedusingtheconfusionmatrix.Thisisthestandardapproachforperformanceestimationinthemachinelearningliterature.However,whilesuchmetricsarecommonandoftenhavearelationtousecases,theyallhaveoneassumption,whichisusuallyunrealistic:allerrorsareequal.Inpractice,someerrorsmattermorethanothererrors.Forexample,lendingahugeamountofmoneytoacustomercariesagreaterriskthanasmallloan.Ifacustomerdefaultsonalargeloan,theimpactofafalsepositivecreditscoreisthuslargerthanforasmallloan.Therefore,itisalwaysagoodideatothinkaboutconcretecosts,beneﬁtsandrisksassociatedwiththetruepositives,falsepositives,truenegatives,andfalsenegativesandidealdeﬁneacostmatrixthatspeciﬁestheindividualgainsandlossesforeachofthesecases.Thisway,youcandeﬁneacustomizedcostfunctionforusecases,whichusuallymeansthatyougetmoremeaningfulresults,e.g.,</text>
