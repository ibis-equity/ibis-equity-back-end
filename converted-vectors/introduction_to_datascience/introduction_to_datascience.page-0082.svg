  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Iteration41:Theclustersbegintoconverge.Theyellowclusterﬁnisheditsjourneytothetop-rightcornerandnowcoversonlythatregion.Similarly,theblueclustercoversthepointsinthemiddle.Thispushedthepurpleclustertotheleftside,whereitisnowresidingwithaconsiderablysmallercovariancethaniniteration21.Thegreenclusterisstilltornbetweentheleftsideandthebottom,butstartstodrifttothebottom,becausepurplenowclaimsmostoftheleft.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Iteration61:Theclustersconverged.Purplenowcoverstheinstancesontheleftandgreenmovedtotheinstancesatthebottom.IntheaboveexamplewealsoseetwoimportantpropertiesofEMclustering.First,theconvergenceismuchslowerthanwith</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-Means.Therearemoreparametersthatmustbeoptimized,i.e.,notonlythemeanvaluesbutalsothecovariances.Additionally,thesoftclusteringmeansthatinstancesbelongtoallclusters.Thisslowsthemovementofthemeanvalues,becausetheygeta(weak)pullfrommanyinstances,especiallywhenthecovarianceislarge.Second,weseethattheclustersmaycoverdisjointregions.Forexample,initeration41,thegreenclustercontainstheinstancesatthebottom,andsomeinstancesontheleftside.Betweentheseinstancesarepurpleinstances,i.e.,therearetwodisjointregionsofthegreencluster.Thisispossibleduetotheshapeofthecovariances.Becausegreenhasalargercovariance,pointsthatarefartherawayfromthemeanhaveahigherprobabilityofbeinggreenthanpurple,becauseofthelowcovariance.Thiseffectofdisjointregionsissomethingthatcannotbeobservedwithmanyclusteringalgorithms.Forexample,thisisimpossiblewith</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-Means,becausedistanceschangethesameinalldirections.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Note:</text>
