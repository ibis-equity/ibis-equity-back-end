  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Iteration1:Westartwithfournormaldistributionsthatarealmostthesame.Themeanvaluesareinthemiddleofthedata,thecovariancesareellipsesthatareelongatedinthediagonal,butslightlydifferent.Forexample,wecanseethatthegreencovarianceellipsegoesabitmoretothebottomleft,andthattheyellowonegoesabitmoretothetopright.Thisalreadyshowsintheassignmentoftheinstancestotheclusters:theinstancesinthetop-rightcornerbelongtotheyellowcluster,theinstancesontheleftsidebelongtothegreencluster.Theothertwoclustersarenotreallyvisibleduetotheoverlap.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Iteration21:After21iterationsweseethatthefournormaldistributionsstarttodriftapart.Theyellowoneispulledintothetop-rightcorner,butstillhasalargecovarianceellipse.Thegreenoneactuallyis“torn”betweentheinstancesontheleftandtheinstancesatthebottom.Theblueoneisinthemiddlewitharelativelysmallcovariance.Thesmallcovarianceisanindicatorthattheblueclusterwillnotmovestronglyanymoreandstayinthemiddle.Thepurpleclusterisalsointhemiddle,butstillhasaverylargecovariance,whichmeansthatitwilllikelystillmoveelsewhere.</text>
