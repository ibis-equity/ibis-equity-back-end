    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ProblemsofDBSCAN</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WhileDBSCANdoesnothavetheproblemthatthenumberofclustersmustbedeﬁnedbytheuserandcanalsoﬁndclustersofanyshape,thereareotheraspectsofthealgorithmthatmaybeproblematic.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ThebiggestproblemofDBSCANisthatitcanbedifﬁculttoﬁndgoodvaluesfor</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝜖</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">and</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑚𝑖𝑛𝑃𝑡𝑠</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Especiallyifclustersareveryclosetoeachother,itcanbeverydifﬁculttoseparatethedataintotwoclusters.Thereasonisthattheinstanceswheretheclustersareclosetoeachotheractas</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">bridgepoints</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">betweentheclusters.ThiscanonlybeavoidedbyusingalargevalueforminPtsthatdecreasesthelikelihoodthatpointsattheborderofclustersarecorepoints.However,thismeansthat</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝜖</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">mustberelativelyhigh,whichcanalsoleadtoproblems.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Anotherproblemisthatclustersmayhavedifferentdensities.Theexamplebelowshowstheclusteringofcircles.Withonly100instancespercircle,thedataintheoutercircleisnotverydenseincomparisontotheinnercircle.Asaconsequence,therearesomebreaksintheoutercircleanditisnotdetectedasasinglecluster,butratherasmanyclusters.Whentheinstancesintheoutercircleareincreased,bothclustersaredetectedcorrectly.Thisproblemcanbequitesevere,ifeveryclusterhasdifferentdensities.</text>
