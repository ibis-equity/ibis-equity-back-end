    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">willmergeexistingclusters.ReducingminPtsusuallyleadstomoreclusters,butmayalsoallowverysmallclustersthatdonotmakesense.Additionally,reducingminPtsmayalsomergeclustersthatareclosetoeachother,becausetherearemorecorepointsthatcouldserveasabridgebetweentheclusters.IncreasingminPtsavoidssmallclustersbutcanalsoleadtonoclustersorlotsofnoiseif</text>
