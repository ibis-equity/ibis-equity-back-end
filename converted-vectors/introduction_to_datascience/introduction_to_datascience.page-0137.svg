  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">whenwediscussedLogisticRegressionorintheexampleabove.WenowtakeacloserlookathowLinearRegressionworks.TheformulaoftheregressionfunctionofLinearRegressionis</text>
