  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WedirectlyobservetheproblemwithMAEandMSE:becausewehaverandomlygenerateddata,MAEandMSEhavenorealmeaningforus.Weonlyseethatthevaluesofthebadresultarelargerthanthevaluesforthegoodresult:about60%higherforMAEandabout3timeshigherforMSE.PleasenotethatthevaluesforMSEarelessthanthevaluesforMAE,because</text>
