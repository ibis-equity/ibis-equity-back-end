  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thecoefﬁcientsdeﬁnehowafeatureinﬂuencesthedependentvariable.Thecoefﬁcientsarecloselyrelatedtothecorrelationbetweenthedependentvariableandthefeatures.Usually,apositivecoefﬁcientmeansthatthefeatureispositivelycorrelatedtothedependentvariable,anegativecoefﬁcientmeansthatthereisanegativecorrelation.However,therearealsoexceptionstothisgeneralrule,aswewillseeinthenextsections.Theinterceptisthe“basevalue”ofthedependentvariable,i.e.,thevalueofthedependentvariableifallfeatureswouldbezero.Thisconceptcanbevisualizedasthelocationwherearegressionline</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">intercepts</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">theaxisofthecoordinatesystem.ThekeyaspectofLinearRegressionishowthecoefﬁcientsandinterceptaredetermined,asthiscanaffectnotonlythequalityoftheregressionfunction,butalsohowthecoefﬁcientsmaybeinterpreted.</text>
