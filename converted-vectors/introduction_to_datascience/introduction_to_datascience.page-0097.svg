    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.1</text>
    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Overview</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Classiﬁcationisaboutassigningcategoriestoobjects.Considerthefollowingexample.</text>
    <g>
      <g transform="matrix(.3594576,0,0,.35946719,72,280.453)"/>
    </g>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Wehavetwoimages,oneshowsawhaleintheseainfrontofaniceberg,theothershowsabearinthewoods.Whenwelookatthesepictures,weimmediatelyseethis,becauseweinstinctivelyassignthesecategoriestotheimages.Classiﬁcationisalesspowerfulapproximationofwhatweinstinctivelydo.Themaindifferenceisthatweneedtoworkwithaﬁxedandknownsetofcategories.Forexample,ourcategoriescouldbe“whalepicture”,“bearpicture”,and“otherimage”.Theimagescanthenbeassignedtooneofthesethreecategories.Thecategoriestowhichclassiﬁcationalgorithmsassignobjectsarecommonlyreferredtoas</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">classes</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Categoriesthatarenotpartoftheclasses,e.g.,ifthereiswaterintheimage,areignored.Abitmoreabstract,classiﬁcationcanbedescribedasfollows.</text>
    <path d="M0 0H468" fill="none" stroke="#000000" stroke-linecap="butt" stroke-linejoin="miter" stroke-width=".398" transform="matrix(1,0,0,-1,72,737.73306)"/>
