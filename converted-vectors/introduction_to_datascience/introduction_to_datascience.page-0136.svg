    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheMAEmeasurestheabsolutedifferencebetweenthepredictionsandtheactualvalues.ThesimilarmeasureMSEusesthesquareddistancesinsteadoftheactualdistances.BecausetheMSEusesthesquaredresiduals,itismoresensitivetooutliersintheresidualsthanMAE.Thus,MSEincreasesstronglywithoutliers,whilethesemaybehiddenwithMAE.ThebiggestproblemwithMAEandMSEisthatbothareabsolutemeasuresfortheerrorand,thus,hardtointerpretbecausethereisnoﬁxedreferencepoint.Theperformancemeasuresforclassiﬁcationweremostlydistributedintheinterval[0,1]anditwasclearwhataperfectresultlookslikeandwhattheworstpossibleresultlookslike.TointerpretMAEandMSE,detailedknowledgeaboutthedependentvariableisrequired,especiallyaboutthescaleofthedependentvariableandthemeaningofdifferences.Inthatrespect,</text>
