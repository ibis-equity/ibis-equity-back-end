  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">CorrelatedFeatures</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Correlatedfeaturesarealsoproblematicforallalgorithms,butespeciallyforthedistance-basedapproaches.Anextremeexamplewouldbeifyouhavetwicealmostthesamefeature,e.g.,thenormalizedageinyearsandthenormalizedageindays.Normalizedmeansthatthevaluesofthefeaturearerescaledtobeintheinterval</text>
