  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-MeansclusteringandEMclusteringisthattheyprovideaconcisemathematicalrepresentationthatdescribeseachcluster,i.e.,thecentersandthenormaldistributions,respectively.Thisisagreattoolfordatascientistfortheinterpretationofthemeaningofclusters.Moreover,theconciserepresentationcanbebeimplementedelsewheretoassigninstancestoclusters,withouttheneedtoapplytheclusteringagain.DBSCANandSLINKbothdonotprovideamathematicalrepresentationoftheclusters.Instead,theclustersareonlydescribedbytheinstancesthemselves.Thisalsohinderstheinterpretation,whichcanalmostonlybedonevisually.SLINKsupportsthisbetter,becauseofthedendrogramswhichgiveanoverviewofthedistancesbetweentheclusters.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">6.6.5</text>
