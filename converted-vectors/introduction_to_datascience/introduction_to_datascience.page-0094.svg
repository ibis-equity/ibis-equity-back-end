  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1]</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thevaluesofbothfeatureswillnotbeidentical,becauseyearsarecoarserthandays,buttheywillbeverysimilarandeffectivelyweonlyhaveonefeatureage.Inthedistancemeasuretheagewouldbeusedtwiceand,consequently,havedisproportionalinﬂuenceonthedistance.Themorecorrelationsthereareinthedata,thestrongerthepotentialnegativeeffectgets.EMclusteringcan,inprinciple,dealwiththecorrelations,becausetheycanberepresentedbythecovariances.How-ever,thereisstilltheproblemthattheclustersgetunnecessarilycomplex,whichmayskewtheBICandleadtoawrongestimationofagoodnumberofclusters.ThereasonforthisisthatthecovariancematrixgrowsquadraticallyandthemodelcomplexityisneedlesslypenalizedbyBICiftherearecorrelatedfeatures.</text>
