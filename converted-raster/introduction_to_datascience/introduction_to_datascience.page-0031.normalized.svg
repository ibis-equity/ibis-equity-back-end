  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">duringtheoperationalization.Whenthecodeisre-written,theoldcodecanalsobeusedforcomparison,e.g.,tocheckiftheresultsareunchanged.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.3.4</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TechnicalSpeciﬁcations</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thecodedoesnotliveonitsown.Coderequiresdocumentationandspeciﬁcations.Thisdocumentationshoulddescribetheenvironmentinwhichthecodecanbeexecuted,e.g.,whichoperationsystemsaresupported,whichothersoftwareisrequired,howdependenciescanbeinstalled,andhowthecodecanberun.Thisis,unfortunately,oftenneglected.Technicalspeciﬁcationsareoftenmissing,outdated,orincomplete.Thislackofdocumentationmaymeanthatthecodebecomesunusable.Regardless,gooddatascientistsensurethatthisisnotthecase.Inresearch,thismaymeanthatareplicationpackageisprovidedtogetherwithapublicationthatcontainsallcodeandadditionaldocumentationrequiredforrunningthecode.Inindustrialprojects,thisshouldbeastandardpartofthepackagingofthesourcecode.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.3.5</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">DataasDeliverable</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Whendataiscollectedorsigniﬁcantlypre-processedandcleanedupduringaproject,thedataitselfmayalsobedeliverable.Sharingofthedatamayenablefutureprojectsandhelpwiththetestingofre-implementationsduringtheoperationalization.Datasharingisespeciallyimportantinacademia.Withoutthesharingofdata,researchcannotbuildoneachother.Moreover,replicationsandthereproductionofpriorresultsmaynotbepossible.Howdatacanbeshareddependsonthesensitivityandtheamountofdata.Sharingofbigdataisdifﬁcult,asitmayactuallybeimpossibletocreatedownloadlinks.Inthiscase,thedatamaybesharedthroughmultiplesmallerpackagesorbyprovidinganaccesspointtothedatabasethatallowsexternalqueryingofthedata.Ifthedatacontainspersonaldata,sharingmaynotbesimpleandrequirededicateddataprivacyagreementsorprioranonymization.Intheindustrialcontext,datacanbesharedinternallywithinacompany.Inresearch,datasharingshouldfollowthe</text>
  <text fill="#377063" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">FAIR</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thus,thedatamustbeﬁndable(e.g.,withaDigitalObjectIdentiﬁer(DOI)),accessible(authenticationsupportifrequired),interoperable(providesallinformationrequiredforusebyothers),andreusable(hasalicenseandisinlinewithcommunitystandards).Ideally,notonlythedataisshared,butalsotheprotocolsandtoolsusedtocreatethedata.</text>
