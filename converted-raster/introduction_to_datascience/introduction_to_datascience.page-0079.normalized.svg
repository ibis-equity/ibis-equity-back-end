    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-Meansalgorithm,toavoidbadresultsduetoawrongnumberofclusters.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Allfeaturesmusthaveasimilarrangeofvalues,ideallyeventhesamerangeofvalues.Otherwise,differencesintherangesofthescalesmayintroduceartiﬁcialweightsbetweenfeatures.Forexample,considerdatawithtwofeatures:ageinyearsandtheyearlyincomeinEuro.Theageis(roughly)between0and100,theincomeinEurois-evenforlowpayingjobs,alreadyat12*400=4,800Euro,butcanalsoeasilybeabove50,000Euro.Thismeansthat,whenwecalculatethedistancebetweentwoinstances,theageisirrelevant,allthatmattersistheincome.Thus,thelargerangeoftheincomescalemeansthattheincomehasahigherweightandastrongerinﬂuenceontheresults.</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Becausetheclusterassignmentisbasedonthedistance,clusterstendtoberound.Clustersthatarenotroughlyroundcanoftennotbedescribedwellbycentroids.Anexamplearethehalf-moonsbelow.Wecanclearlyseethattherearetwohalf-circlesandeachoneisacluster.</text>
