  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">4.1</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">NoFreeLunchTheorem(NFL)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Beforewediveintothealgorithmsforthecreationofmodelsaboutthedata,weneedsomefoundations.Theﬁrstfoundationisafundamentaltheoremaboutoptimizationalgorithms,the</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">NoFreeLunchTheorem</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(NFL).Thisnowgetsabittheoretical,ifyouarejustinterestedinthe(veryimportant!)consequencesofthetheoremondatamodeling,justskiptothecolloquialdeﬁnition.ThemathematicalformulationoftheNFListhefollowing.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">NoFreeLunchTheorem:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Let</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑑</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">beorderedsetsofsize</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">withcostvalues</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑌</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Let</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">→</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑌</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">afunctionthatshouldbeoptimized.Let</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑃</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑑</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">|</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓,𝑚,𝑎</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">theconditionalprobabilityofgetting</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑑</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">by</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">timesrunningthealgorithm</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑎</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">onthefunction</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Foranypairofalgorithms</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑎</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">and</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑎</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">tofollowingequationsholds:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∑︁</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑃</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑑</text>
