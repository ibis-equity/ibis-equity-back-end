  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Aproofforthetheoremcanbe</text>
  <text fill="#377063" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">foundintheliterature</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.TheequationoftheNFLtellsusthesumoftheprobabilitiesofgettingcertaincostsisequalifallfunctions</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">areconsideredforanytwoalgorithms.Themeaningofthiscanbesummarizedasfollows.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">NoFreeLunchTheorem(Colloquial):</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Allalgorithmsareequalwhenallpossibleproblemsareconsidered.Thisiscounter-intuitive,becauseweobservenotabledifferencesbetweendifferentalgorithmsinpractice.However,theNFLdoesnotprohibitthatanalgorithmisbetterforsomefunctions</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-i.e.,forsomeproblems.Butifanalgorithmisbetterthantheaveragealgorithmforsomeproblems,theNFLtellsusthatthealgorithmmustbeworsethantheaveragealgorithmforotherproblems.Thus,thetrueconsequenceoftheNFListhat</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">thereisnotonealgorithmthatisoptimalforallproblems</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Instead,differentalgorithmsarebetterfordifferentproblems.Thatisalsothereasonforthename:thereisno“freelunch”,i.e.,onealgorithmforallproblems.Instead,datascientistsmustearntheirlunch,i.e.,ﬁndasuitablealgorithm.Thismeansthathavingdetailedknowledgeaboutonealgorithmisnotsufﬁcient.Datascientistsneedawholetoolboxofalgorithms.Theymustbeabletoselectasuitablealgorithm,basedonthedata,theirknowledgeabouttheproblem,andtheirexperiencebasedonworkingwithdifferentalgorithms.Overtime,datascientistsgatherexperiencewithmoreandmorealgorithmsandbecomeexpertsinselectingsuitablealgorithmsforagivenproblem.</text>
