  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,i.e.,datawheremultiplevaluesarealloccurringfrequently.Theextremecasewouldbedatawherethecategoriesareuniformlydistributed.Becauseeachcategoryisequallylikely,themodewouldbecompletelyrandom.Moreover,themodedoesnotworkforcontinuousnumericdata,becausehereitisveryunlikelythatthesamevalueoccurstwice.</text>
