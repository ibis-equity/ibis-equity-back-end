  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thearithmeticmeanisnowalothigherandactuallylargerthanallbutonedatapoint.Thisisnotagoodrepresentationofthecentraltendencyofthedata.Themediandidnotchangealotandremainsalmostthesame.Thisisbecausethemedianonlyskipstothenextsortedvalue,whichisrobustagainstsuchoutliers.Youmightaskyourselfwhyyoushouldusethearithmeticmeanatall,ifthemedianisapparentlysuperiorbecauseitismorerobust.Thebiggestreasonforthiscomesfromstochastics:thearithmeticmeaniscloselyrelatedtotheexpectedvalueofrandomvariables.Moreover,thenormaldistributioncanbefullydescribedbythemeanvalueandthestandarddeviation.Thus,fornormallydistributeddata,themeanvalueisactuallytheperfectestimateforthecentraltendency.Regardless,ifyouareunsureaboutthedistributionofthedataandfearthattheremightbyoutliers,itissafertousethemedianinsteadofthearithmeticmean.Thearithmeticmeanandthemediancanonlybeusedfornumericdata.However,whatifyouhave,e.g.,dataaboutclothsizes?Thesearenotnumericvalues,butrathersomethinglike“small”,“medium”,and“large”.SuchdataiscategoricaldataandfurtherdiscussedinChapter4.The</text>
