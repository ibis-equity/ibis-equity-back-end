    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ResourceManager</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">istheschedulerthatprovidesresourcesforapplicationstoenablethecomputations.The</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">NodeManagers</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">areapplicationsrunningontheDataNodes.TheNodeManagerexecutetasksonthelocalresources.Thisway,eachDataNodecanserveascomputenode.ThecomputationaltasksareallocatedsuchthattheyareexecutedbytheNodeManagersrunningontheDataNodeswheretherequireddataisstored.Thus,thecombinationofDataNodesandNodeManagersrunningonthesamephysicalmachineandtheResourceManagerthatisawarewherethedataisstoredintheHDFSenablesdatalocalcomputations.Thecomputationaltasksare,e.g.,executedusingMapReduce.However,YARNcaninprinciplerunanykindofcomputationaltaskontheNodeManagersandisnotlimitedtoMapReduce.TheResourceManagershouldschedulethecomputationaltasksuchthattheresources(CPUcores,memory)arespentefﬁciently.ThismeansthatNodeManagersshouldideallyonlyexecuteonetaskatatime,topreventoverutilization.Underutilizationshouldalsobeavoided:iftherearejobswaitingfortheirexecutionandatthesametime,thereareidleNodeManagersthatcouldconductthejobs,thejobsshouldgettheseresources.ThismeansthattheResourceManagershouldmustbeabletoprovideresourcestomultiplejobs,possiblyofmultipleusers,atthesametime.ThefollowingﬁgureshowshowYARNexecutesapplicationinadistributedmannerandschedulesresources.</text>
