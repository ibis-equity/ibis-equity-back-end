  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">10.3</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Challenges</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thedifﬁcultieswithtextminingdonotstop,justbecausewenowhaveanumericrepresentationofthetextthatwecanuseasinputforalgorithms.Therearemanyotherproblems,manyofthemnotyetsolved,thatmaketextminingintosuchahardproblem.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">10.3.1</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Dimensionality</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Theﬁrstproblemisthedimensionality.Inourexampleofjusteighttweets,wealreadyhave70differenttermsafterpreprocessing.Inlongertext,thereareseveralthousanduniqueterms,evenafterpreprocessing.Thus,thereisahugenumberofcategoricalfeatures.However,notonlythenumberoffeaturesmaybeverylarge,thenumberofdocumentscanalsobeverylarge.Forexample,therearealreadyover50,000tweetsbyDonaldTrump(June2020),andhundredsofmillionsoftweetseveryday.Thecombinationofmanyfeaturesandmanyinstancesmeansthattextminingcanconsumehugeamountsofruntime.Therefore,largetextminingapplicationsonlyworkwithefﬁcientlyimplementedalgorithms,oftenondedicatedhard-warethatallowsformassiveparallelization.Theserequirementsarealsothereasonwhyanalgorithmthatscaleswellwithlargeamountsofdata,likeMultinomialNaiveBayes,isstillapopularchoicefortextmining.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">10.3.2</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ambiguities</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thesecondproblemisthatnaturallanguageifoftenambiguous.Partially,thiscannotbesolved,becausenaturallanguageis,unlessusedwithgreatcare,impreciseandtheexactmeaningisoftenonlyunderstandablefromaverybroadcontext.Forexample,thefollowingsentencecanhaveadifferentmeaning,thatcanonlybeunderstoodfromthecontext.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ihitamanwithastick.(Iusedasticktohitaman.)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ihitamanwithastick.(Ihitthemanwhowasholdingastick.)Suchproblemsareoftenimpossibletoresolveandleadtonoiseintheanalysis.Otherproblemswithambiguitiesaretosomedegreesolvable,butmayalsoleadtonoiseintheanalysis,especiallywithabag-of-words.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Homonyms</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">arewordswithmultiplemeanings.Forexample,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">break</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">canmean</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">tobreaksomething</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,butalso</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">takeabreak</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thebag-of-wordsdoesnotdifferentiatebetweenthesemeanings.Otherapproaches,suchas</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-gramsandwordembeddingscan,tosomedegree,accountforthis,butnotperfectly.Therearealsosyntacticambiguities,wherethemeaningchangesdependingonthesyntacticstructureofasentence.Thefollowingnine-wordsentenceusestheword</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">only</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ineverypossibleposition.Themeaningchangeswitheveryposition.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Onlyhetoldhismistressthathelovedher.(Nobodyelsedid.)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Heonlytoldhismistressthathelovedher.(Hedidn’tshowher.)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
