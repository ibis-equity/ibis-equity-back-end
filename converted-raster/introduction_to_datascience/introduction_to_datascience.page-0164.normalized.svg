  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Hetoldhismistressthatonlyhelovedher.(“I’mallyougot,nobodyelsewantsyou.”)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
