  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ProjectManager</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Theprojectmanageristheorganizeroftheprojectworkandtheday-to-daybusiness.Thisincludestheplanningandmanagementofresources(monetary,human,computational),aswellasthecontrollingoftheprojectprogress.Theprojectmanagerensuresthemilestonesareachievedandobjectivesaremetontimeandwiththeexpectedquality.Theprojectmanagerregularlyassessestherisksandpossiblyimplementscorrectivemeasurestomitigatetherisks.Intheextremecasethismayalsomeanthattheprojectmanagerhastoabortprojectsorrequestadditionalresources,becauseasuccessfulcompletionoftheprojectmaynotbepossiblewiththerequiredresources.Inacademicprojects,theprojectmanagerisoftenthesamepersonastheprojectsponsor,orsomeoneworkingfortheprojectsponsor,e.g.,apost-docoraPhDstudentworkinginthelabofaprofessor.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.2.4</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">BusinessIntelligenceAnalyst</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thebusinessintelligenceanalystisthetraditionalbusinessintelligencerole.Thebusinessintelligenceanalystsareusuallyalsodomainexperts,althoughnotbusinessusers.Additionally,theyknowthedataverywellandareexpertsoncreatingreportsfromthedata,includingthekeyperformanceindicators(KPIs)relevantforthedomain.Thisroledoesnotreallyexistinacademia.Theclosestthingwouldbearesearcher,whois,e.g.,usedtoevaluatingtaxonomiesmanually,butnotthroughalgorithms.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.2.5</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">DataEngineer</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ThedataengineerisinvolvedintheETL/ELToftheprocessandresponsiblewithmakingthedataaccessibleintheanalysisenvironmentinascalablemanner.Dataengineersrequirestrongtechnicalskillsifdatastillneedstobecollectedandinbigdataprojects.Inmostacademicprojects,thereisnoseparationbetweenthedataengineerandthedatascientist.Insomedisciplines,e.g.,genomics,dataengineersmayexistintheroleofpreparinggenomicdatafromthelabforusewithbioinformaticstoolsorinhighenergyphysics,wherewholeteamspreparethehugeamountsofdatacollectedforfurtheranalysis.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.2.6</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">DatabaseAdministrator</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thedatabaseadministratorsupportsthedataengineerandthedatascientiststhroughthedeploymentandadministra-tionoftheanalysisenvironmentfortheproject.Thetasksincludetheinstallationandconﬁgurationof(distributed)databases,softwarefordistributedcomputingincomputeclusters,andtheprovisionoftherequiredtoolsfortheanaly-sis.Inacademicprojects,thisroleisnotseparatedfromthedatascientist,ortheadministratoroftheresearchinstituteorrelatedcomputecenterfulﬁllsthisrole.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2.2.7</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">DataScientist</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thedatascientististheexpertwithrespecttotheanalysisofthedataandmodeling.Thedatascientisthasdeepknowledgeaboutdataanalysistechniquesandisabletoselectsuitabletechniquestoachievethedesiredbusinessobjective.Thedatascientistisresponsiblefortheanalysisofthedataandhastoensurethattheanalysisobjectivesaremet.Ifthisisnotpossible,thedatascientistsmustcommunicatethisassoonaspossibletotheprojectmanager,asthisisusuallyamajorriskwithindatascienceprojects.Inacademia,thisroleisusuallytheresearcherwhoexecutesaproject.</text>
