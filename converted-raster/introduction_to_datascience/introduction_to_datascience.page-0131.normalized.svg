  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Logisticregressionhasahighexplanatoryvalue,becausethecoefﬁcientscanbeinterpretedasoddsratio.Therefore,logisticregressioniswellsuitedtounderstandtheimpactofthefeaturesontheresult.However,thisrequiresmoretrainingandeffortthanfordecisiontrees.Theremainingmodelshavealmostnoreliableexplanatoryvalue.ForNaiveBayes,theindividualprobabilitiesmaybeconsidered,buttheyareusuallynotreliablebecauseofthenaiveassumptionofindependence.Theinterpretationofneuralnetworksiscurrentlyaveryactiveﬁeldofresearch,e.g.,byvisualizingtheweightsofthenetworkortheactivationoftheneurons,tobetterunderstandwhatinﬂuencesthedecisions.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.11.5</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Scoring</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">For</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘&gt;</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,theaverageoftheneighborsmaybeusedasscoreforthe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-NearestNeighboralgorithm.However,thesescoresareusuallynotverygood.Ifscoresarerelevant,adifferentalgorithmshouldbeused.ThecountsofthedifferentclassesinthepartitionsofaDecisionTreecanbeusedtodeterminethescores.Throughaveraging,thiscanbegeneralizedtoRandomForests.LogisticRegressiondirectlyestimatestheprobabilityoftheoutcomeand,hence,thescore.Thescoresofthesethreealgorithmsare</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">wellcalibrated</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,whichmeansthattheycanbeusedasreliableestimatesoftheprobabilitythatthepredictioniscorrect.NaiveBayesalsoprovidesscoresthatcanbeused.However,thescoresofNaiveBayesareusuallynotwellcalibrated,becauseofthenaiveassumption.SVMsdonotsupportscoringatall.AtricktoallowsomescoringwithSVMsistocreateaseparateregressionmodeltoestimatethescoresforthepredictionsofaSVM.However,ifscoresareimportant,adifferentalgorithmthatnativelysupportsscoringshouldbeused.Neuralnetworksalsosupportscoring.Ifthescoresarewellcalibrateddependsontheneuralnetworkstructureandthetargetfunctionofthetraining.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.11.6</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">CategoricalFeatures</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">OnlytheDecisionTree,RandomForest,andMultinomialNaiveBayesworkwithoutrestrictionsforcategoricalfea-tures.Forallotheralgorithms,one-hotencodingcanbeusedtosupportcategoricalfeatures.Thisusuallyworkswell,exceptforthe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-NearestNeighboralgorithm.The</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-NearestNeighboralgorithmreliesondistancemeasures,whicharenotusefulforone-hotencodeddata.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.11.7</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">MissingFeatures</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Noneofthealgorithmscaneasilydealwithmissingfeatures.DecisionTreesandRandomForestsmayworktosomedegreewithrandomfeatures.Forexample,afeaturemaynotbeinallsubtreesofaDecisionTree.Allsubtreeswithoutthisfeaturecanstillbeused,whichmeansmanyinstancesmaystillbepredictedcorrectly.ForRandomForest,onecouldjustignorealltreesintheensemble,inwhichthefeatureispresent.Especiallyifthenumberoftreesintheensembleishuge,thisapproachshouldworkwell.Forallotheralgorithms,thecomputationsdonotmakesensewithmissingfeatures.While</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-NearestNeighborcannotworkwithmissingfeatures,thisalgorithmiscommonlyusedto</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">impute</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">thevaluesformissingfeatures(see,e.g.,</text>
  <text fill="#377063" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">BarnardandMeng,1999</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">).Hence,onemayarguethatmissingfeaturesareactuallyastrengthof</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑘</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">-NearestNeighbor.</text>
