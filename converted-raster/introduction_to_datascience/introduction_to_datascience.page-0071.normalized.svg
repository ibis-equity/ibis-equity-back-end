    <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Overview</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Clusteringisaboutﬁndinggroupsofrelatedobjectswithininstances.Considerthefollowingexample.</text>
    <g>
      <g transform="matrix(.3633696,0,0,.36334557,72,280.46403)"/>
    </g>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ontheleftsidearealotofemoticons,whichareobjects.Clusteringtakesalltheseobjectsandseparatesthemintogroups.Above,wehavetwogroups:onewithhappyemoticonsandonewithsademoticons.Thegroupsarecreatedbasedonthefeaturesoftheobjects,nootherinformationisused.Togetaseparationintohappyandsademoticons,thefeaturesmustreﬂecttheemotion.Ifthefeatureswould,e.g.,reﬂectthecolors,theclusteringalgorithmwouldseparatethesmiliesintoyellowandorangeemoticons.Ifthefeatureswouldreﬂectthedegreeoffacialhair,theclusteringalgorithmwouldseparatetheemoticonsintothosewithnobeardandthosewithamoustache.Abitmoreabstract,clusteringcanbedescribedasfollows.</text>
