    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Theevaluationofclusteringresultsisabitdifferentfromtheevaluationoftheothercategoriesofalgorithms.Thereasonforthisisthattherearenogenericcriteria.Instead,thecriteriadependontheclusteringalgorithmandtheusecase.Eachclusteringalgorithmcomeswithitsownapproachforﬁndingrelatedobjects,i.e.,itsownconceptofsimilarity.Consequently,howgoodtheclustersmatchthedata,suchthatthedatawithintheclustersisreallysimilartoeachother,dependsonthedeﬁnitionofsimilarityusedbytheclusteringalgorithm.Wewilldiscusssuchcriteriatogetherwithalgorithms.Theimportanceoftheusecasecanbeseenusingtheemoticonexampleabove.Ifweareinterestedinemotion,wehaveaperfectgrouping.Ifwe,ontheotherhand,wanttoidentifyemoticonsfromdifferentsetsofemoticons,theclustersshouldbetheorangeonesandtheyellowones.Unfortunately,suchaspectscannotbemeasuredbygeneric</text>
