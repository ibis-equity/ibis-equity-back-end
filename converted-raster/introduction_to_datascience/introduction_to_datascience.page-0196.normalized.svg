  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">SinceSpark2.0,usersofApacheSparkdonothavetoworkwithRDDsanymore,butcanalsousedataframes,similartothedataframesweknowfrompandas.ThisdataframeAPIisrightlycoupledwiththeSparkSQLcomponents,whichistheprimarywayforcreatingthedataframes.ThesupportfordataframesisanotherreasonwhygettingstartedwithSparkisoftensimplerthanwithotherBigDataframeworks.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">12.4.3</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Infrastructure</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WhileSparkcontainsallcomponentstocreateacomputecluster,thisisnotthenormalwayinwhichSparkisused.Instead,Sparkisusuallyusedtogetherwithoneofthemanycompatibletechnologies.Forexample,SparkisfullycompatiblewithYARNandHDFS,i.e.,datastoredinHadoopclusterscanalsobeanalyzedwithApacheSpark.Sparkcanalsobeusedwithmanyothertechnologies,e.g.,EC2cloudsorKubernetesforcomputationordatabaseslikeCassandra,HBase,orMongoDBforstorage.Thus,analysisdesignedwithApacheSparkarenotlockedintoaspeciﬁcframework,whichisanothernotabledifferencetoHadoop.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">12.4.4</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WordCountwithSpark</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">WhileSparkitselfiswritteninScala,SparkapplicationscanalsobewritteninJava,Python(PySpark),andR(SparkR).Usersdonothavetodeﬁnethedependenciesbetweendifferenttasksmanually.Instead,Sparkassumesthattheorderinwhichthetasksaredeﬁnedistheorderinwhichtheyshouldbeexecuted.Iftasksareusingdifferentdata,theycanbeexecutedinparallel,ifataskrequiresdatafromapreviouslydeﬁnedtask,thisdataisautomaticallyshufﬂedtothetaskandtheexecutiononlystartswhenthedataisavailable.Duetothis,thesourcecodeforSparkjobscontainslessboilerplatecodefordeﬁningformatsthanthatofHadoopapplications.Forexample,withApacheSpark,thewordcountmylooklikethis.</text>
