<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="792" version="1.1" viewBox="0 0 612 792" width="612">
  <defs/>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">IntroductiontoDataScience,Release0.1</text>
  <path d="M0 0H468" fill="none" stroke="#000000" stroke-linecap="butt" stroke-linejoin="miter" stroke-width=".398" transform="matrix(1,0,0,-1,72,47.29303)"/>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.1.1</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">TheFormalProblem</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Formally,wehaveasetofobjects</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑂</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">{</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑜𝑏𝑗𝑒𝑐𝑡</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑜𝑏𝑗𝑒𝑐𝑡</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,...</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">}</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">thatmaybeinﬁnite.Moreover,wehaverepresentationsoftheseobjectsinafeaturespace</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℱ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">{</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝜑</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑜</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">):</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑜</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑂</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">}</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">andaﬁnitesetofclasses</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">{</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐𝑙𝑎𝑠𝑠</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,...,𝑐𝑙𝑎𝑠𝑠</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">}</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Theclassiﬁcationisdeﬁnedbya</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">targetconcept</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">thatmapsobjectstoclasses,i.e.,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">*</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑂</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">→</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thetargetconceptisourgroundtruth,i.e.,aperfectassignmentofobjectstotheclasses.Usually,wehavenomathe-maticaldescriptionforthetargetconcept.Forexample,thereisnosuchmathematicaldescriptionfortheclassiﬁcationofimagesaswhalepicturesandbearpictures.The</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">hypothesis</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">mapsfeaturestoclasses</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℱ→</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thehypothesisisdeterminedbyaclassiﬁcationalgorithmwiththegoaltoapproximatethetargetconceptsuchthat</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">*</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑜</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">≈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝜑</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑜</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">))</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.1.2</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Scores</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Avariantofclassiﬁcationisthatthehypothesiscomputes</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">scores</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">foreachclass</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Inthiscase,wehaveascoringfunctionforeachclassoftheform</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℱ→</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">R</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Scoresaresimilarto</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">softclustering</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:insteadofdecidingforonlyasingleclass,theclassiﬁcationdeterminesavalueforeachclass,whichwecanusetoevaluatehowcertainthealgorithmiswiththedecisionforaclass.Whenwewanttoassigntheclassbasedonthescores,weusuallyjustassigntheclasswiththehighestscore.Thus,wehave</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)=argmax</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">for</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈ℱ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Often,thescoresareprobabilitydistributions,i.e.,thescoresforeachclassareintheinterval[0,1]andthesumofallscoresis1,i.e.,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∑︁</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑐</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)=1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">forall</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈ℱ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">7.1.3</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">BinaryClassiﬁcationandThresholds</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Aspecialcaseofclassiﬁcationproblemsiswherewehaveexactlytwoclasses.Whilethisisastrongrestriction,therearemanyproblemsthatcanbesolvedusingbinaryclassiﬁcation.Forexample,thepredictionifaborrowerwillpaybackmoney,thepredictionifatransactionisfraudulent,orthepredictionofwhetheranemailisspamornot.Forbinaryclassiﬁcation,weusuallysaythatoneclassis</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">positive</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">andtheotherclassis</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">negative</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Thus,wehaveexactlytwoclasses.Ifwehaveonlytwoclasses</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝐶</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">{</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑝𝑜𝑠𝑖𝑡𝑖𝑣𝑒,𝑛𝑒𝑔𝑎𝑡𝑖𝑣𝑒</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">}</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">andthescores,wecancalculatethescoreofoneclassbasedonthescoreoftheotherclass,incasethescoresareaprobabilitydistribution,i.e.,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛𝑒𝑔𝑎𝑡𝑖𝑣𝑒</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)=1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">−</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑝𝑜𝑠𝑖𝑡𝑖𝑣𝑒</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">becausethesumoftheprobabilitiesisone.Becauseitissufﬁcienttousethescoringfunctionforthe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑝𝑜𝑠𝑖𝑡𝑖𝑣𝑒</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,weusethenotation</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">′</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ℎ</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑝𝑜𝑠𝑖𝑡𝑖𝑣𝑒</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">forbinaryclassiﬁcation.Inthiscase,wecanalsousea</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">threshold</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑡</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">[0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1]</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">todetermine</text>
