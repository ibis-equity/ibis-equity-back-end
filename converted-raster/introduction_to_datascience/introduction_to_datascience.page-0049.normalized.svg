    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Asyoucansee,thepair-wisescatterplotisnotasingleplot,butacollectionofplotsthatisorganizedasamatrix.Thediagonalofthematrixarehistogramsofthefeatures.Theotherplotsshowtherelationshipbetweentwofeatures.Eachpointintheplotsrepresentsoneinstance.Thelinesrepresenthowalinearregressionwouldbeﬁttothedata.Ifthepointsareclosetotheline,thismeansalinearrelationship,iftheyarespreadout,therelationshipisnotlinear.Iftheslopeofthelineisnegative(downwards),thecorrelationbetweenthedataisnegative,iftheslopeispositive(upwards),thecorrelationispositive.Thevaluesonthex-axisareforthefeaturedeﬁnedattheverybottomofthevisualization,thevaluesonthey-axisareforthefeaturedeﬁnedontheveryleftofthevisualization.Forexample,thesecondplotintheﬁrstrowshowstherelationshipbetweenthesepalwidthonthex-axisandthesepallengthonthey-axis.Fromtheaboveplot,wecanlearnbothabouttheindividualfeaturesthroughthehistogram,aswellasthepairwiserelationshipsbetweenthefeatures.Herearesomeexamplesforwhatwecanlearn.</text>
