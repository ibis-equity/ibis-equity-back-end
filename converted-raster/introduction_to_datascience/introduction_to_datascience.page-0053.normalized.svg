    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thehexbinplotismoreorlessatwo-dimensionalhistogram.Theareaissplitintohexagons(i.e.,ourbins)andtheplotshowsusingacolorscalehowmuchdatafallsintoeachhexagon.Nowwenotonlyseethestructureofthedata,butcanalsosayhowmuchdataislocatedineveryregionofthedata.Beforeweﬁnishtheexplorationoftherelationshipbetweenfeatures,wetakeanotherlookatcorrelations.Wealreadybrieﬂydiscussedthatwecanobservecorrelationsbetweenfeaturesinscatterplots,especiallyifweaddregressionlines.However,thisapproachdoesnotscalewellwhenitcomestotheidentiﬁcationofcorrelations.Ifwehavemanyfeatures,thenumberofpair-wiseplotswewouldhavetoanalyzeincreasesquadratically.Amoreefﬁcientwaytogetageneraloverviewofcorrelationsisa</text>
