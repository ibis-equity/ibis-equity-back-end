    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Thecorrelationheatmapvisualizesthevaluesofthecorrelationcoefﬁcientsbetweenthefeatures.Redmeansastrongpositivecorrelation,bluemeansanegativecorrelation,whitemeansnocorrelation.Thestrongerthesaturationofthecolor,thestrongerthecorrelation.Thediagonalhasaperfectpositivecorrelation,becausefeaturesarealwaysperfectlycorrelatedwiththemselves.Moreover,weseethatouranalysisfromthepair-wiseplotswascorrect:thereisaverystrongpositivecorrelationbetweenthepetallengthandthepetalwidth.Wealsoseestrongnegativecorrelationsbetweenthesepalwidthandthepetallengthandpetalwidth.Anotherobservationfromthepair-wiseplotsisalsoconﬁrmed:thereisalmostnocorrelationbetweenthesepallengthandthesepalwidth.</text>
