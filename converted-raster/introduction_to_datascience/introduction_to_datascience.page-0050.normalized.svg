  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Note:Wedonotdiscusscorrelationindetail.Thegeneralconceptisquitesimple.WesaythattwofeaturesXandYarepositivelycorrelated,ifXusuallyincreases,ifYincreases.Themoreoftenthisisthecase,thestrongerthecorrelation.Viceversa,wesaythatXandYarenegativelycorrelated,ifXusuallydecreases,ifYincreases.Alinearcorrelationimpliesthatthisrelationshipintheincreaseisregularsuchthat</text>
