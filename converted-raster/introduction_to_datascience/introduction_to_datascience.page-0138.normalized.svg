  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">IntroductiontoDataScience,Release0.1</text>
  <path d="M0 0H468" fill="none" stroke="#000000" stroke-linecap="butt" stroke-linejoin="miter" stroke-width=".398" transform="matrix(1,0,0,-1,72,47.29303)"/>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">8.3.1</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">OrdinaryLeastSquares</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ThestandardwaytoestimatethecoefﬁcientsofLinearRegressionisusingthe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">OrdinaryLeastSquares</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(OLS)method.Forthis,weinterprettheinstanceasmatrixandthedependentvariablesandcoefﬁcientsasvectors:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">⎛⎜⎝</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">...𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.........</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">...𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛,𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">⎞⎟⎠</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,...,𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑛</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,...,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑚</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Becauseofthis,wecanusematrixmultiplicationtocalculateallthepredictionsgivenasetofcoefﬁcientsasasinglevector,i.e.,</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋𝑏.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Sincewewanttominimizetheresiduals,wecanformulatethisasanoptimizationproblem</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">min</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">−</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑓</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">*</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">22</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=min</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">−</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">22</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Hence,weminimizethesquareoftheEuclideannorm(see</text>
  <text fill="#377063" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Chapter6</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">),inotherwordswearelookingforthesolutionwiththe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">leastsquares</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Becausewehavemoreinstancesthanfeatures(otherwisewehavetoomanyfeatures),thereareusuallymultipleoptimalsolutionsforthisoptimizationproblem.WhilethesesolutionsarethesamewithrespecttotheOLS,therecanbeinterestingeffectsifthefeaturesarecorrelatedwitheachother.Thiscanbedemonstratedwithanexample.Considertwofeatures</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">andadependentvariable</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">suchthat</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑥</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Herearesomeexamplesforoptimalsolutions:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Solution1:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">5</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">5</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Solution2:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Solution3:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">•</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Solution4:</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=10000</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">−</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">9999</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ingeneral,anysolutionwith</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">and</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">isoptimal.Theﬁrstthreesolutionswelistedseemreasonable.However,asolutionwithverylargecoefﬁcientsisalsopossibleandoptimal.Thisalsodemonstratesthatthecoefﬁ-cientsoffeaturescanbemisleadingintermsofcorrelationwiththedependentvariable.Intheexampleabove</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">and</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">2</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">canassumeanyrealvalueand,thusindicateanypossiblecorrelation.</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">8.3.2</text>
  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ridge</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Inthefollowing,weshowhowOLScanbemodiﬁedwith</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">regularization</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">toﬁndtheﬁrstthreesolutionsandavoidtheproblemswithcorrelatedfeatures.Theideaofregularizationissimple:whentheoptimizationproblemallowsmultiplesolutions,someofwhicharemoredesirablethanothers,wemodifytheproblemsuchthatfavorablesolutionsarebetter.Thisisdonebyaddinga</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">regularizationterm</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">totheOLSformula.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Ridge</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">regularizationisbasedontheideathatsmallervaluesforcoefﬁcientsarebetterthanlargervalues.Thus,weshouldselecttheoptimalsolutionthatminimizesthevaluesofthecoefﬁcients.Toachievethis,theOLSproblemismodiﬁedsuchthat</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">min</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑋𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">−</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑦</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">22</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝛼</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">22</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">where</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝛼</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">∈</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">R</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,𝛼&gt;</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">regulatesthestrengthoftheregularizationterm.Todemonstratetheeffectofthisregularization,wecalculate</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">𝑏</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">||</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">22</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">forthefoursolutionsofourexampleabove:</text>
