  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#readfromstandardinput</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">for</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">line</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">in</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">sys</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">stdin:</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#splitlineintowords</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">words</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">line</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">strip()</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">split()</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#createoutputpairs</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">for</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">in</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">words:</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#printoutputpairstostandardoutput</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#keyandvalueareseparatedbytab(standardforHadoop)</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">print</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">\t</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(word,</text>
  <text fill="#21804f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">))</text>
