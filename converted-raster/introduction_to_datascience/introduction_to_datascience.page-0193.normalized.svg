  <text fill="#20435c" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">StreamingMode</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">HadoopalsoprovidesaJavaApplicationthatcanbeusedtoHadoopinthe</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">streamingmode</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.Inthestreamingmode,thestandardinputandstandardoutputareused,similartoLinuxpipes.ThedatafromtheHDFSisreadandforwardedtoanarbitraryapplicationthatprocessesthedatafromthestandardinput.Theresultsofthecomputationarewrittentothestandardoutput.Forexample,apythonscriptforthemap()functionofthewordcountwouldlooklikethis.</text>
  <path d="M0 0H473.978V159.402H0Z" fill="#ffffff" transform="matrix(1,0,0,-1,69.011,310.961)"/>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#!/usr/bin/envpython</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">"""mapper.py"""</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">import</text>
