  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">Similarly,thereduce()functionwouldalsousethestandardinputandoutput.</text>
  <path d="M0 0H473.978V345.704H0Z" fill="#ffffff" transform="matrix(1,0,0,-1,69.011,684.36)"/>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#!/usr/bin/envpython</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">"""reducer.py"""</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">from</text>
  <text fill="#0d85b5" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">operator</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">import</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">itemgetter</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">import</text>
  <text fill="#0d85b5" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">sys</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#initcurrentwordandcounterasnotexisting</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_word</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">None</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_count</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text fill="#21804f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">0</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">None</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#readfromstandardinput</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">for</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">line</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">in</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">sys</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">stdin:</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#readoutputfrommapper.py</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word,count</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">line</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">strip()</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">.</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">split(</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">\t</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">,</text>
  <text fill="#21804f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">1</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">)count</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">int</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(count)</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#Hadoopshufflesortsbykey</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#-&gt;allvalueswithsamekeyarenexttoeachother</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">if</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_word</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">==</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word:current_count</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">+</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">count</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">else</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">:</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">if</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_word:</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#writeresulttostandardoutput</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">print</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">\t</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(current_word,current_count))</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#resetcounterandupdatecurrentword</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_count</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">countword</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">=</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word</text>
  <text fill="#40808f" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">#outputforlastword</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">if</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">current_word</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">==</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">word:</text>
  <text fill="#007021" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">print</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">\t</text>
  <text fill="#70a1d1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%s</text>
  <text fill="#4070a1" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">'</text>
  <text fill="#666666" transform="matrix(1 0 -0 1 0 792)" x="0" y="0">%</text>
  <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(current_word,current_count))</text>
