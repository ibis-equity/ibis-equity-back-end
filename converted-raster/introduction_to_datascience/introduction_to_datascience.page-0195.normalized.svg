    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">ResilientDistributedDatasets</text>
    <text transform="matrix(1 0 -0 1 0 792)" x="0" y="0">(RDDs).Thesedatastructuresprovideanabstractionlayerfordataoperations,independentoftheactualtypeofthedata.TheRDDsorganizedatainimmutablepartitions,suchthatallelementsinaRDDcanbeprocessedinparallel.Thus,theRDDsaresimilartothekey-valuepairsofHadoopsMapReduce.Consequently,Sparkallowsthedeﬁnitionofmap()andreduce()functionsonRDDs,giventhatthedatawithintheRDDarekey-valuepairs.However,SparkgoesbeyondthecapabilitiesofHadoop,becauseRDDscanalsocontaindatathatarenotkey-valuepairs,ﬁlteringofRDDsissupportedand,ingeneral,anyuser-deﬁnedfunctioncanbeappliedtothedatawithinanRDD.Additionally,theRDDscanbepersistedtothestorage,ifrequested.</text>
